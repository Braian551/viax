map $uri $spa_valid_route {
    default 0;
    ~^/$ 1;
    ~^/(clientes|conductores|empresas|legal|eliminar-cuenta)$ 1;
    ~^/(login|register|forgot-password|register-company)$ 1;
    ~^/(admin|soporte|cliente|conductor|empresa)(/.*)?$ 1;
    ~^/share/[^/]+$ 1;
}

map $args $has_tracking_params {
    default 0;
    ~*(^|&)(utm_[^=]+|ref|id)= 1;
}

server {
    listen 80;
    server_name viaxcol.online www.viaxcol.online;
    return 301 https://viaxcol.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.viaxcol.online;

    ssl_certificate /etc/letsencrypt/live/viaxcol.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viaxcol.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://viaxcol.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name viaxcol.online;

    root /var/www/viax/sitioweb;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/viaxcol.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viaxcol.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Normalizacion de slash final: /clientes/ -> /clientes
    if ($uri ~ "^(.+[^/])/{1,}$") {
        return 301 https://viaxcol.online$1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share links deben ser noindex a nivel HTTP (sin depender de JS)
    location ^~ /share/ {
        add_header X-Robots-Tag "noindex, nofollow" always;

        if ($has_tracking_params) {
            return 301 https://viaxcol.online$uri;
        }

        if ($uri !~ "^/share/[^/]+$") {
            return 404;
        }

        try_files /index.html =404;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    # Assets estaticos: cache larga e inexistentes como 404 real
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Otros archivos publicos estaticos
    location ~* \.(?:json|txt|xml|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
    }

    # Fallback SPA solo para rutas validas y existentes en app
    location / {
        # Eliminar parametros de tracking
        if ($has_tracking_params) {
            return 301 https://viaxcol.online$uri;
        }

        # Evita redireccion implicita a slash final por directorios fisicos.
        try_files $uri.html $uri/index.html @spa_fallback;
    }

    location @spa_fallback {
        if ($spa_valid_route = 0) {
            return 404;
        }
        try_files /index.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    location ~ /\.{
        deny all;
    }
}
