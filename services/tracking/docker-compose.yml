services:
  tracking:
    build:
      context: .
      dockerfile: Dockerfile
    image: viax-tracking:latest
    container_name: viax_tracking_service
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - TRACKING_STREAM_KEY=trip_tracking_stream
      - TRACKING_CONSUMER_GROUP=tracking_realtime_publishers
      - TRACKING_CONSUMER_NAME=tracking_publisher_01
      - VIAX_EVENTS_CHANNEL=viax:events
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
