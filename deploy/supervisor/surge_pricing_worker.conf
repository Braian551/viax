[program:viax_surge_pricing_worker]
command=php /var/www/viax/backend/workers/surge_pricing_worker.php
directory=/var/www/viax/backend
autostart=true
autorestart=true
startsecs=2
startretries=5
user=www-data
stdout_logfile=/var/log/supervisor/viax_surge_pricing_worker.log
stderr_logfile=/var/log/supervisor/viax_surge_pricing_worker.err
stopasgroup=true
killasgroup=true
