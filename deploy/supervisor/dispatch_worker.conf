[program:viax_dispatch_worker]
command=php /var/www/viax/backend/workers/dispatch_worker.php
directory=/var/www/viax/backend
autostart=true
autorestart=true
startsecs=2
startretries=5
user=www-data
stdout_logfile=/var/log/supervisor/viax_dispatch_worker.log
stderr_logfile=/var/log/supervisor/viax_dispatch_worker.err
stopasgroup=true
killasgroup=true
