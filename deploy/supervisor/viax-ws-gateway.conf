[program:viax-ws-gateway]
command=node /var/www/viax/backend/realtime-gateway/src/server.js
directory=/var/www/viax/backend/realtime-gateway
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=10
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/viax/ws-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=NODE_ENV="production",WS_PORT="9100",REDIS_HOST="127.0.0.1",REDIS_PORT="6379",LOG_LEVEL="info"
