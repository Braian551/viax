# Bloque upstream para el gateway WebSocket
upstream viax_ws_gateway {
    server 127.0.0.1:9100;
    keepalive 64;
}

# Dentro del bloque server {} existente, agregar:

# WebSocket gateway
location /ws {
    proxy_pass http://viax_ws_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts para WebSocket (mantener conexión viva)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Sin buffer para streaming
    proxy_buffering off;
}

# Endpoints HTTP del gateway (health, metrics)
location /ws-gateway/ {
    proxy_pass http://viax_ws_gateway/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Solo acceso interno para métricas
    # allow 127.0.0.1;
    # deny all;
}
